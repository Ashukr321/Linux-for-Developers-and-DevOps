<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">How a File Is Found: Directory Entry, Inode, Data Blocks</text>

  <!-- Directory -->
  <rect x="30" y="90" width="240" height="250" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="150" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#075985">Directory /home/ashu</text>
  <text x="150" y="138" text-anchor="middle" font-size="12.5" fill="#0369a1">a table of name to inode number</text>
  <g font-family="Consolas, monospace" font-size="14" fill="#0f172a">
    <rect x="50" y="155" width="200" height="34" rx="5" fill="#ffffff" stroke="#7dd3fc"/>
    <text x="62" y="177">.</text><text x="238" y="177" text-anchor="end">1048577</text>
    <rect x="50" y="195" width="200" height="34" rx="5" fill="#ffffff" stroke="#7dd3fc"/>
    <text x="62" y="217">..</text><text x="238" y="217" text-anchor="end">1048570</text>
    <rect x="50" y="235" width="200" height="34" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="62" y="257" font-weight="700">notes.txt</text><text x="238" y="257" text-anchor="end" font-weight="700">1048612</text>
    <rect x="50" y="275" width="200" height="34" rx="5" fill="#ffffff" stroke="#7dd3fc"/>
    <text x="62" y="297">app.log</text><text x="238" y="297" text-anchor="end">1048640</text>
  </g>

  <path d="M250 252 H340" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="295" y="242" text-anchor="middle" font-size="12" fill="#64748b">inode no.</text>

  <!-- Inode -->
  <rect x="345" y="90" width="270" height="360" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">Inode 1048612</text>
  <text x="480" y="138" text-anchor="middle" font-size="12.5" fill="#15803d">metadata (no file name!)</text>
  <g font-size="13.5" fill="#0f172a">
    <text x="365" y="168">Type: regular file</text>
    <text x="365" y="192">Permissions: rw-r--r-- (644)</text>
    <text x="365" y="216">Owner UID / Group GID: 1000 / 1000</text>
    <text x="365" y="240">Size: 10240 bytes</text>
    <text x="365" y="264">Link count: 1</text>
    <text x="365" y="288">Timestamps: atime, mtime, ctime</text>
  </g>
  <rect x="362" y="306" width="236" height="128" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="480" y="326" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Block pointers</text>
  <g font-family="Consolas, monospace" font-size="13" fill="#0f172a">
    <text x="378" y="352">ptr 0 -&gt; block 5021</text>
    <text x="378" y="376">ptr 1 -&gt; block 5022</text>
    <text x="378" y="400">ptr 2 -&gt; block 7730</text>
    <text x="378" y="424" fill="#64748b">... indirect / extents</text>
  </g>

  <path d="M560 348 H690" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M560 372 C620 372 630 300 690 300" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M560 396 C620 396 630 410 690 410" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Data blocks -->
  <text x="780" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Data blocks on disk</text>
  <text x="780" y="138" text-anchor="middle" font-size="12.5" fill="#64748b">the actual file content</text>
  <g font-family="Consolas, monospace" font-size="13" fill="#0f172a">
    <rect x="695" y="280" width="170" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8"/><text x="780" y="305" text-anchor="middle">block 5022</text>
    <rect x="695" y="330" width="170" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8"/><text x="780" y="355" text-anchor="middle">block 5021</text>
    <rect x="695" y="390" width="170" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8"/><text x="780" y="415" text-anchor="middle">block 7730</text>
  </g>
  <rect x="695" y="160" width="170" height="100" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="780" y="186" text-anchor="middle" font-size="12.5" fill="#713f12">Blocks need not be</text>
  <text x="780" y="204" text-anchor="middle" font-size="12.5" fill="#713f12">next to each other;</text>
  <text x="780" y="222" text-anchor="middle" font-size="12.5" fill="#713f12">the inode keeps</text>
  <text x="780" y="240" text-anchor="middle" font-size="12.5" fill="#713f12">their order.</text>

  <!-- Footer -->
  <rect x="30" y="470" width="840" height="36" rx="8" fill="#f1f5f9"/>
  <text x="450" y="493" text-anchor="middle" font-size="14" fill="#0f172a">See it yourself: <tspan font-family="Consolas, monospace" fill="#16a34a">ls -i notes.txt</tspan>  and  <tspan font-family="Consolas, monospace" fill="#16a34a">stat notes.txt</tspan></text>
</svg>
