<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Standard Streams and Redirection</text>

  <!-- Process -->
  <rect x="340" y="140" width="220" height="200" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="178" text-anchor="middle" font-size="20" font-weight="700" fill="#166534">Process</text>
  <text x="450" y="200" text-anchor="middle" font-size="13" fill="#14532d">e.g. sort, grep, a script</text>
  <g font-size="15" font-weight="700" fill="#0f172a" font-family="Consolas, Menlo, monospace">
    <text x="352" y="250">fd 0</text>
    <text x="510" y="230">fd 1</text>
    <text x="510" y="310">fd 2</text>
  </g>

  <!-- stdin sources -->
  <g text-anchor="middle">
    <rect x="40" y="150" width="200" height="60" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="140" y="178" font-size="17" font-weight="700" fill="#075985">Keyboard</text>
    <text x="140" y="198" font-size="13" fill="#0369a1">default stdin</text>
    <rect x="40" y="270" width="200" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="140" y="298" font-size="16" font-weight="700" fill="#0f172a" font-family="Consolas, Menlo, monospace">input.txt</text>
    <text x="140" y="318" font-size="13" fill="#475569" font-family="Consolas, Menlo, monospace">cmd &lt; input.txt</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M242,180 L300,180 L300,245 L334,245" marker-end="url(#arrow)"/>
    <path d="M242,300 L300,300 L300,245" stroke-dasharray="6 4"/>
  </g>
  <text x="270" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">stdin</text>

  <!-- stdout / stderr targets -->
  <g text-anchor="middle">
    <rect x="660" y="80" width="200" height="60" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="760" y="108" font-size="17" font-weight="700" fill="#075985">Terminal</text>
    <text x="760" y="128" font-size="13" fill="#0369a1">default stdout + stderr</text>
    <rect x="660" y="170" width="200" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="760" y="198" font-size="16" font-weight="700" fill="#0f172a" font-family="Consolas, Menlo, monospace">out.log</text>
    <text x="760" y="218" font-size="13" fill="#475569" font-family="Consolas, Menlo, monospace">&gt; out.log  or  &gt;&gt; out.log</text>
    <rect x="660" y="260" width="200" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="760" y="288" font-size="16" font-weight="700" fill="#991b1b" font-family="Consolas, Menlo, monospace">errors.log</text>
    <text x="760" y="308" font-size="13" fill="#991b1b" font-family="Consolas, Menlo, monospace">2&gt; errors.log</text>
    <rect x="660" y="350" width="200" height="60" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="760" y="378" font-size="16" font-weight="700" fill="#0f172a" font-family="Consolas, Menlo, monospace">/dev/null</text>
    <text x="760" y="398" font-size="13" fill="#475569">2&gt; /dev/null discards</text>
  </g>
  <g stroke-width="2" fill="none">
    <path d="M562,225 L610,225 L610,110 L654,110" stroke="#475569" marker-end="url(#arrow)"/>
    <path d="M610,200 L654,200" stroke="#475569" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <path d="M562,305 L620,305 L620,290 L654,290" stroke="#dc2626" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
    <path d="M620,305 L620,380 L654,380" stroke="#dc2626" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
    <path d="M562,320 L640,320 L640,124 L654,124" stroke="#dc2626" marker-end="url(#arrowRed)"/>
  </g>
  <text x="586" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">stdout</text>
  <text x="590" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">stderr</text>
  <text x="450" y="372" text-anchor="middle" font-size="13" fill="#475569">solid line = default target, dashed line = after redirection</text>

  <rect x="40" y="430" width="820" height="36" rx="8" fill="#0f172a"/>
  <text x="450" y="454" text-anchor="middle" font-size="15" fill="#ffffff" font-family="Consolas, Menlo, monospace">0 = stdin   1 = stdout   2 = stderr     cmd &gt; all.log 2&gt;&amp;1  sends both to one file</text>
</svg>
