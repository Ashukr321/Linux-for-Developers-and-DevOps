<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">vi / vim Modes and Transitions</text>

  <!-- Normal mode (center) -->
  <rect x="330" y="200" width="240" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="450" y="245" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">Normal Mode</text>
  <text x="450" y="270" text-anchor="middle" font-size="14" fill="#14532d">default · move, delete, copy, paste</text>
  <text x="450" y="292" text-anchor="middle" font-size="13" fill="#14532d">vi file.txt starts here</text>

  <!-- Insert mode (left) -->
  <rect x="30" y="200" width="200" height="110" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="130" y="245" text-anchor="middle" font-size="20" font-weight="700" fill="#075985">Insert Mode</text>
  <text x="130" y="272" text-anchor="middle" font-size="14" fill="#0369a1">type text</text>
  <text x="130" y="292" text-anchor="middle" font-size="13" fill="#0369a1">-- INSERT --</text>

  <!-- Command-line mode (right) -->
  <rect x="670" y="200" width="200" height="110" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="770" y="245" text-anchor="middle" font-size="20" font-weight="700" fill="#854d0e">Command-line</text>
  <text x="770" y="272" text-anchor="middle" font-size="14" fill="#713f12">:w  :q  :wq  :%s</text>
  <text x="770" y="292" text-anchor="middle" font-size="13" fill="#713f12">/pattern  ?pattern</text>

  <!-- Visual mode (bottom) -->
  <rect x="350" y="400" width="200" height="80" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="450" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#9d174d">Visual Mode</text>
  <text x="450" y="460" text-anchor="middle" font-size="13" fill="#9d174d">select text · y d &gt; &lt;</text>

  <!-- Normal -> Insert -->
  <line x1="330" y1="230" x2="234" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="282" y="220" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">i a o I A O</text>
  <!-- Insert -> Normal -->
  <line x1="230" y1="285" x2="326" y2="285" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="282" y="305" text-anchor="middle" font-size="15" font-weight="600" fill="#16a34a">Esc</text>

  <!-- Normal -> Command -->
  <line x1="570" y1="230" x2="666" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="618" y="220" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">:  /  ?</text>
  <!-- Command -> Normal -->
  <line x1="670" y1="285" x2="574" y2="285" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="618" y="305" text-anchor="middle" font-size="15" font-weight="600" fill="#16a34a">Enter / Esc</text>

  <!-- Normal -> Visual -->
  <line x1="420" y1="310" x2="420" y2="396" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="408" y="365" text-anchor="end" font-size="15" font-weight="600" fill="#0f172a">v  V  Ctrl+v</text>
  <!-- Visual -> Normal -->
  <line x1="480" y1="400" x2="480" y2="314" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="492" y="365" font-size="15" font-weight="600" fill="#16a34a">Esc / after y d</text>

  <!-- Start note -->
  <line x1="450" y1="115" x2="450" y2="196" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="450" y="98" text-anchor="middle" font-size="15" fill="#0f172a">$ vi script.sh</text>

  <text x="450" y="510" text-anchor="middle" font-size="13" fill="#64748b">Tip: when unsure which mode you are in, press Esc twice to return to Normal mode</text>
</svg>
