<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="900" height="780" fill="#ffffff"/>
  <text x="450" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Linux Boot Process</text>
  <text x="450" y="70" text-anchor="middle" font-size="14" fill="#64748b">From power button to login prompt</text>

  <g font-size="14">
    <!-- 1 Firmware -->
    <rect x="60" y="90" width="780" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <circle cx="100" cy="125" r="20" fill="#0284c7"/><text x="100" y="131" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
    <text x="140" y="118" font-size="18" font-weight="700" fill="#0f172a">BIOS / UEFI firmware</text>
    <text x="140" y="142" fill="#334155">POST hardware check, find the boot device (MBR or EFI System Partition)</text>
    <line x1="450" y1="160" x2="450" y2="178" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 2 Bootloader -->
    <rect x="60" y="185" width="780" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="100" cy="220" r="20" fill="#ca8a04"/><text x="100" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
    <text x="140" y="213" font-size="18" font-weight="700" fill="#0f172a">Bootloader (GRUB 2)</text>
    <text x="140" y="237" fill="#334155">Shows boot menu, reads /boot/grub/grub.cfg, loads vmlinuz + initramfs into RAM</text>
    <line x1="450" y1="255" x2="450" y2="273" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 3 Kernel -->
    <rect x="60" y="280" width="780" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="100" cy="315" r="20" fill="#7c3aed"/><text x="100" y="321" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>
    <text x="140" y="308" font-size="18" font-weight="700" fill="#0f172a">Linux kernel</text>
    <text x="140" y="332" fill="#334155">Decompresses itself, detects CPU and memory, starts drivers, unpacks initramfs</text>
    <line x1="450" y1="350" x2="450" y2="368" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 4 initramfs -->
    <rect x="60" y="375" width="780" height="70" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <circle cx="100" cy="410" r="20" fill="#db2777"/><text x="100" y="416" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">4</text>
    <text x="140" y="403" font-size="18" font-weight="700" fill="#0f172a">initramfs (temporary root)</text>
    <text x="140" y="427" fill="#334155">Loads disk/LVM/RAID/crypto modules, mounts the real root filesystem, switch_root</text>
    <line x1="450" y1="445" x2="450" y2="463" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 5 systemd -->
    <rect x="60" y="470" width="780" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <circle cx="100" cy="505" r="20" fill="#16a34a"/><text x="100" y="511" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">5</text>
    <text x="140" y="498" font-size="18" font-weight="700" fill="#0f172a">init / systemd (PID 1)</text>
    <text x="140" y="522" fill="#334155">First user-space process: mounts filesystems, starts services in parallel</text>
    <line x1="450" y1="540" x2="450" y2="558" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 6 Target -->
    <rect x="60" y="565" width="780" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <circle cx="100" cy="600" r="20" fill="#16a34a"/><text x="100" y="606" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">6</text>
    <text x="140" y="593" font-size="18" font-weight="700" fill="#0f172a">Target / runlevel</text>
    <text x="140" y="617" fill="#334155">multi-user.target (runlevel 3) or graphical.target (runlevel 5)</text>
    <line x1="450" y1="635" x2="450" y2="653" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 7 Login -->
    <rect x="60" y="660" width="780" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <circle cx="100" cy="695" r="20" fill="#0284c7"/><text x="100" y="701" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">7</text>
    <text x="140" y="688" font-size="18" font-weight="700" fill="#0f172a">Login</text>
    <text x="140" y="712" fill="#334155">getty on a TTY, sshd, or a display manager (GDM / SDDM), then your shell</text>
  </g>

  <g font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">
    <text transform="translate(30,268) rotate(-90)">FIRMWARE + KERNEL SPACE</text>
    <text transform="translate(30,600) rotate(-90)">USER SPACE</text>
  </g>
  <line x1="20" y1="458" x2="880" y2="458" stroke="#94a3b8" stroke-dasharray="6 5"/>
  <text x="450" y="760" text-anchor="middle" font-size="12" fill="#64748b">Check it on a running system: systemd-analyze · journalctl -b · dmesg</text>
</svg>
