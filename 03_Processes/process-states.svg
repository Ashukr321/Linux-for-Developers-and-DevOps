<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Linux Process States and Transitions</text>

  <!-- Row 1 states -->
  <g font-size="17" font-weight="700" text-anchor="middle">
    <rect x="30" y="110" width="140" height="60" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="100" y="146" fill="#075985">New</text>

    <rect x="230" y="110" width="150" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="305" y="137" fill="#166534">Ready</text>
    <text x="305" y="157" font-size="12" font-weight="400" fill="#14532d">runnable, in run queue (R)</text>

    <rect x="520" y="110" width="150" height="60" rx="10" fill="#16a34a" stroke="#166534" stroke-width="2"/>
    <text x="595" y="137" fill="#ffffff">Running</text>
    <text x="595" y="157" font-size="12" font-weight="400" fill="#ffffff">on the CPU (R)</text>

    <rect x="730" y="110" width="140" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="800" y="137" fill="#854d0e">Zombie</text>
    <text x="800" y="157" font-size="12" font-weight="400" fill="#713f12">exited, not reaped (Z)</text>
  </g>

  <!-- Row 2 states -->
  <g font-size="17" font-weight="700" text-anchor="middle">
    <rect x="230" y="330" width="150" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="305" y="357" font-size="15" fill="#5b21b6">Waiting / Sleeping</text>
    <text x="305" y="377" font-size="12" font-weight="400" fill="#4c1d95">blocked on I/O (S, D)</text>

    <rect x="520" y="330" width="150" height="60" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="595" y="357" fill="#9d174d">Stopped</text>
    <text x="595" y="377" font-size="12" font-weight="400" fill="#9d174d">paused by a signal (T)</text>

    <rect x="730" y="330" width="140" height="60" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="800" y="357" fill="#0f172a">Terminated</text>
    <text x="800" y="377" font-size="12" font-weight="400" fill="#334155">removed from table</text>
  </g>

  <!-- Transitions -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="170" y1="140" x2="228" y2="140"/>
    <line x1="380" y1="128" x2="518" y2="128"/>
    <line x1="520" y1="155" x2="382" y2="155"/>
    <line x1="670" y1="140" x2="728" y2="140"/>
    <line x1="530" y1="170" x2="372" y2="328"/>
    <line x1="305" y1="330" x2="305" y2="172"/>
    <line x1="570" y1="170" x2="570" y2="328"/>
    <line x1="625" y1="330" x2="625" y2="172"/>
    <line x1="800" y1="170" x2="800" y2="328"/>
  </g>

  <!-- Transition labels -->
  <g font-size="13" fill="#0f172a">
    <text x="199" y="130" text-anchor="middle">admitted</text>
    <text x="449" y="120" text-anchor="middle">scheduler dispatch</text>
    <text x="449" y="186" text-anchor="middle">preempted / time slice over</text>
    <text x="699" y="130" text-anchor="middle">exit()</text>
    <text x="440" y="232" text-anchor="end">waits for I/O,</text>
    <text x="440" y="249" text-anchor="end">sleep(), read()</text>
    <text x="295" y="245" text-anchor="end">I/O done /</text>
    <text x="295" y="262" text-anchor="end">event occurs</text>
    <text x="562" y="245" text-anchor="end">SIGSTOP /</text>
    <text x="562" y="262" text-anchor="end">Ctrl+Z</text>
    <text x="633" y="245">SIGCONT</text>
    <text x="633" y="262">(fg / bg)</text>
    <text x="790" y="245" text-anchor="end">parent</text>
    <text x="790" y="262" text-anchor="end">calls wait()</text>
  </g>

  <!-- Legend / notes -->
  <rect x="30" y="425" width="840" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="452" font-size="15" font-weight="700" fill="#16a34a">How to read it</text>
  <g font-size="13" fill="#0f172a">
    <text x="50" y="476">A new process is created with fork() and usually loads a new program with exec().</text>
    <text x="50" y="497">Letters in brackets are the STAT codes shown by ps: R = running/runnable, S = interruptible sleep,</text>
    <text x="50" y="518">D = uninterruptible sleep (disk I/O), T = stopped, Z = zombie (exited but parent has not called wait()).</text>
  </g>
</svg>
