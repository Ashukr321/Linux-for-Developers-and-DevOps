<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 950" width="1160" height="950" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1160" height="950" fill="#ffffff"/>
<text x="580.0" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">UNIX File System: Directories &amp; What They Store</text>
<g id="logo"><rect x="1012" y="14" width="118" height="50" rx="8" fill="#0f172a"/><rect x="1016" y="18" width="110" height="42" rx="6" fill="none" stroke="#f59e0b" stroke-width="1.5"/><text x="1071" y="50" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" letter-spacing="3" fill="#ffffff">UNIX</text></g>
<rect x="520.0" y="80" width="120" height="44" rx="8" fill="#1e3a8a"/>
<text x="580.0" y="109" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff" font-family="Consolas, monospace">/ (root)</text>
<text x="655.0" y="107" font-size="13" fill="#64748b">top of the tree: every directory below lives inside /</text>
<path d="M580.0 124V146M215.0 146H955.0M215.0 146V168M585.0 146V168M955.0 146V168" stroke="#94a3b8" stroke-width="2" fill="none"/>
<g><rect x="40" y="168" width="350" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="40" y="168" width="7" height="108" rx="3" fill="#2563eb"/><text x="60" y="197" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#2563eb">/bin</text><text x="140" y="196" font-size="14.5" font-weight="700" fill="#0f172a">Essential user commands</text><text x="60" y="221" font-size="12.5" fill="#475569">Programs every user needs, even when</text><text x="60" y="238" font-size="12.5" fill="#475569">the system is in single-user mode.</text><text x="60" y="262" font-size="12" fill="#64748b"><tspan font-weight="600">e.g. </tspan><tspan font-family="Consolas, monospace">ls, cp, mv, cat, bash</tspan></text></g>
<g><rect x="410" y="168" width="350" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="410" y="168" width="7" height="108" rx="3" fill="#2563eb"/><text x="430" y="197" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#2563eb">/sbin</text><text x="510" y="196" font-size="14.5" font-weight="700" fill="#0f172a">System admin commands</text><text x="430" y="221" font-size="12.5" fill="#475569">Programs to boot, repair and manage</text><text x="430" y="238" font-size="12.5" fill="#475569">the system - mostly run by root.</text><text x="430" y="262" font-size="12" fill="#64748b"><tspan font-weight="600">e.g. </tspan><tspan font-family="Consolas, monospace">fsck, mount, reboot, ip</tspan></text></g>
<g><rect x="780" y="168" width="350" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="780" y="168" width="7" height="108" rx="3" fill="#2563eb"/><text x="800" y="197" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#2563eb">/lib</text><text x="880" y="196" font-size="14.5" font-weight="700" fill="#0f172a">Shared libraries &amp; modules</text><text x="800" y="221" font-size="12.5" fill="#475569">Libraries needed by /bin and /sbin,</text><text x="800" y="238" font-size="12.5" fill="#475569">plus kernel modules (drivers).</text><text x="800" y="262" font-size="12" fill="#64748b"><tspan font-weight="600">e.g. </tspan><tspan font-family="Consolas, monospace">libc.so, /lib/modules/</tspan></text></g>
<g><rect x="40" y="290" width="350" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="40" y="290" width="7" height="108" rx="3" fill="#2563eb"/><text x="60" y="319" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#2563eb">/usr</text><text x="140" y="318" font-size="14.5" font-weight="700" fill="#0f172a">User programs (read-only)</text><text x="60" y="343" font-size="12.5" fill="#475569">Most installed software: binaries,</text><text x="60" y="360" font-size="12.5" fill="#475569">libraries, headers, docs, manuals.</text><text x="60" y="384" font-size="12" fill="#64748b"><tspan font-weight="600">e.g. </tspan><tspan font-family="Consolas, monospace">/usr/bin, /usr/lib, /usr/local</tspan></text></g>
<g><rect x="410" y="290" width="350" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="410" y="290" width="7" height="108" rx="3" fill="#2563eb"/><text x="430" y="319" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#2563eb">/opt</text><text x="510" y="318" font-size="14.5" font-weight="700" fill="#0f172a">Optional add-on software</text><text x="430" y="343" font-size="12.5" fill="#475569">Third-party packages, each kept</text><text x="430" y="360" font-size="12.5" fill="#475569">self-contained in its own folder.</text><text x="430" y="384" font-size="12" fill="#64748b"><tspan font-weight="600">e.g. </tspan><tspan font-family="Consolas, monospace">/opt/google/chrome</tspan></text></g>
<g><rect x="780" y="290" width="350" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="780" y="290" width="7" height="108" rx="3" fill="#d97706"/><text x="800" y="319" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#d97706">/boot</text><text x="880" y="318" font-size="14.5" font-weight="700" fill="#0f172a">Boot loader files</text><text x="800" y="343" font-size="12.5" fill="#475569">Kernel image, initial RAM disk and</text><text x="800" y="360" font-size="12.5" fill="#475569">boot loader config used at startup.</text><text x="800" y="384" font-size="12" fill="#64748b"><tspan font-weight="600">e.g. </tspan><tspan font-family="Consolas, monospace">vmlinuz, initrd.img, grub/</tspan></text></g>
<g><rect x="40" y="412" width="350" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="40" y="412" width="7" height="108" rx="3" fill="#d97706"/><text x="60" y="441" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#d97706">/etc</text><text x="140" y="440" font-size="14.5" font-weight="700" fill="#0f172a">System configuration</text><text x="60" y="465" font-size="12.5" fill="#475569">Plain-text config files for the system</text><text x="60" y="482" font-size="12.5" fill="#475569">and services (no programs here).</text><text x="60" y="506" font-size="12" fill="#64748b"><tspan font-weight="600">e.g. </tspan><tspan font-family="Consolas, monospace">passwd, shadow, fstab, hosts</tspan></text></g>
<g><rect x="410" y="412" width="350" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="410" y="412" width="7" height="108" rx="3" fill="#16a34a"/><text x="430" y="441" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#16a34a">/home</text><text x="510" y="440" font-size="14.5" font-weight="700" fill="#0f172a">Users' home directories</text><text x="430" y="465" font-size="12.5" fill="#475569">One folder per normal user: personal</text><text x="430" y="482" font-size="12.5" fill="#475569">files, settings and dotfiles.</text><text x="430" y="506" font-size="12" fill="#64748b"><tspan font-weight="600">e.g. </tspan><tspan font-family="Consolas, monospace">/home/ashu/.bashrc</tspan></text></g>
<g><rect x="780" y="412" width="350" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="780" y="412" width="7" height="108" rx="3" fill="#16a34a"/><text x="800" y="441" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#16a34a">/root</text><text x="880" y="440" font-size="14.5" font-weight="700" fill="#0f172a">Root user's home</text><text x="800" y="465" font-size="12.5" fill="#475569">Home directory of the superuser,</text><text x="800" y="482" font-size="12.5" fill="#475569">kept apart from /home.</text><text x="800" y="506" font-size="12" fill="#64748b"><tspan font-weight="600">e.g. </tspan><tspan font-family="Consolas, monospace">/root/.bashrc</tspan></text></g>
<g><rect x="40" y="534" width="350" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="40" y="534" width="7" height="108" rx="3" fill="#16a34a"/><text x="60" y="563" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#16a34a">/srv</text><text x="140" y="562" font-size="14.5" font-weight="700" fill="#0f172a">Service data</text><text x="60" y="587" font-size="12.5" fill="#475569">Data this machine serves to others,</text><text x="60" y="604" font-size="12.5" fill="#475569">such as web or FTP site files.</text><text x="60" y="628" font-size="12" fill="#64748b"><tspan font-weight="600">e.g. </tspan><tspan font-family="Consolas, monospace">/srv/www, /srv/ftp</tspan></text></g>
<g><rect x="410" y="534" width="350" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="410" y="534" width="7" height="108" rx="3" fill="#db2777"/><text x="430" y="563" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#db2777">/var</text><text x="510" y="562" font-size="14.5" font-weight="700" fill="#0f172a">Variable data</text><text x="430" y="587" font-size="12.5" fill="#475569">Files that grow or change while the</text><text x="430" y="604" font-size="12.5" fill="#475569">system runs: logs, queues, caches.</text><text x="430" y="628" font-size="12" fill="#64748b"><tspan font-weight="600">e.g. </tspan><tspan font-family="Consolas, monospace">/var/log, /var/spool, /var/mail</tspan></text></g>
<g><rect x="780" y="534" width="350" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="780" y="534" width="7" height="108" rx="3" fill="#db2777"/><text x="800" y="563" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#db2777">/tmp</text><text x="880" y="562" font-size="14.5" font-weight="700" fill="#0f172a">Temporary files</text><text x="800" y="587" font-size="12.5" fill="#475569">Scratch space any user can write to;</text><text x="800" y="604" font-size="12.5" fill="#475569">usually cleared on reboot.</text><text x="800" y="628" font-size="12" fill="#64748b"><tspan font-weight="600">e.g. </tspan><tspan font-family="Consolas, monospace">/tmp/session123</tspan></text></g>
<g><rect x="40" y="656" width="350" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="40" y="656" width="7" height="108" rx="3" fill="#db2777"/><text x="60" y="685" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#db2777">/run</text><text x="140" y="684" font-size="14.5" font-weight="700" fill="#0f172a">Runtime data</text><text x="60" y="709" font-size="12.5" fill="#475569">Info about the running system since</text><text x="60" y="726" font-size="12.5" fill="#475569">last boot: PIDs, sockets, locks.</text><text x="60" y="750" font-size="12" fill="#64748b"><tspan font-weight="600">e.g. </tspan><tspan font-family="Consolas, monospace">/run/sshd.pid</tspan></text></g>
<g><rect x="410" y="656" width="350" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="410" y="656" width="7" height="108" rx="3" fill="#ea580c"/><text x="430" y="685" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#ea580c">/dev</text><text x="510" y="684" font-size="14.5" font-weight="700" fill="#0f172a">Device files</text><text x="430" y="709" font-size="12.5" fill="#475569">Special files that stand for hardware;</text><text x="430" y="726" font-size="12.5" fill="#475569">read/write them to talk to devices.</text><text x="430" y="750" font-size="12" fill="#64748b"><tspan font-weight="600">e.g. </tspan><tspan font-family="Consolas, monospace">/dev/sda, /dev/tty, /dev/null</tspan></text></g>
<g><rect x="780" y="656" width="350" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="780" y="656" width="7" height="108" rx="3" fill="#ea580c"/><text x="800" y="685" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#ea580c">/mnt</text><text x="880" y="684" font-size="14.5" font-weight="700" fill="#0f172a">Temporary mount point</text><text x="800" y="709" font-size="12.5" fill="#475569">Where an admin manually mounts a</text><text x="800" y="726" font-size="12.5" fill="#475569">filesystem for a short time.</text><text x="800" y="750" font-size="12" fill="#64748b"><tspan font-weight="600">e.g. </tspan><tspan font-family="Consolas, monospace">mount /dev/sdb1 /mnt</tspan></text></g>
<g><rect x="40" y="778" width="350" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="40" y="778" width="7" height="108" rx="3" fill="#ea580c"/><text x="60" y="807" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#ea580c">/media</text><text x="140" y="806" font-size="14.5" font-weight="700" fill="#0f172a">Removable media</text><text x="60" y="831" font-size="12.5" fill="#475569">Auto-mount point for USB drives,</text><text x="60" y="848" font-size="12.5" fill="#475569">CDs and DVDs.</text><text x="60" y="872" font-size="12" fill="#64748b"><tspan font-weight="600">e.g. </tspan><tspan font-family="Consolas, monospace">/media/usb</tspan></text></g>
<g><rect x="410" y="778" width="350" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="410" y="778" width="7" height="108" rx="3" fill="#7c3aed"/><text x="430" y="807" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#7c3aed">/proc</text><text x="510" y="806" font-size="14.5" font-weight="700" fill="#0f172a">Process &amp; kernel info</text><text x="430" y="831" font-size="12.5" fill="#475569">Created by the kernel in memory;</text><text x="430" y="848" font-size="12.5" fill="#475569">one folder per running process.</text><text x="430" y="872" font-size="12" fill="#64748b"><tspan font-weight="600">e.g. </tspan><tspan font-family="Consolas, monospace">/proc/cpuinfo, /proc/1234/</tspan></text></g>
<g><rect x="780" y="778" width="350" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="780" y="778" width="7" height="108" rx="3" fill="#7c3aed"/><text x="800" y="807" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#7c3aed">/sys</text><text x="880" y="806" font-size="14.5" font-weight="700" fill="#0f172a">Devices &amp; drivers (sysfs)</text><text x="800" y="831" font-size="12.5" fill="#475569">In-memory view of hardware, drivers</text><text x="800" y="848" font-size="12.5" fill="#475569">and kernel settings.</text><text x="800" y="872" font-size="12" fill="#64748b"><tspan font-weight="600">e.g. </tspan><tspan font-family="Consolas, monospace">/sys/class/net</tspan></text></g>
<rect x="40" y="913" width="14" height="14" rx="3" fill="#2563eb"/><text x="60" y="924" font-size="13" fill="#475569">Programs &amp; libraries</text>
<rect x="210" y="913" width="14" height="14" rx="3" fill="#d97706"/><text x="230" y="924" font-size="13" fill="#475569">Configuration &amp; boot</text>
<rect x="380" y="913" width="14" height="14" rx="3" fill="#16a34a"/><text x="400" y="924" font-size="13" fill="#475569">User &amp; service data</text>
<rect x="543" y="913" width="14" height="14" rx="3" fill="#db2777"/><text x="563" y="924" font-size="13" fill="#475569">Variable &amp; temporary</text>
<rect x="713" y="913" width="14" height="14" rx="3" fill="#ea580c"/><text x="733" y="924" font-size="13" fill="#475569">Devices &amp; mount points</text>
<rect x="897" y="913" width="14" height="14" rx="3" fill="#7c3aed"/><text x="917" y="924" font-size="13" fill="#475569">Virtual (kernel, in RAM)</text>
</svg>
