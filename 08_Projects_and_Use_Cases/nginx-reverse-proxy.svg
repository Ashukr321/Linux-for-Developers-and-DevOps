<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Nginx as a Reverse Proxy on Ubuntu</text>

  <!-- Client -->
  <rect x="20" y="170" width="120" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="80" y="205" text-anchor="middle" font-size="18" font-weight="700" fill="#075985">Browser</text>
  <text x="80" y="227" text-anchor="middle" font-size="13" fill="#0369a1">example.com</text>
  <line x1="142" y1="210" x2="173" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Internet -->
  <rect x="178" y="170" width="110" height="80" rx="40" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="233" y="205" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Internet</text>
  <text x="233" y="227" text-anchor="middle" font-size="13" fill="#475569">HTTP / HTTPS</text>
  <line x1="290" y1="210" x2="321" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Server boundary -->
  <rect x="320" y="70" width="565" height="355" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="602" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b">UBUNTU SERVER</text>

  <!-- Firewall -->
  <rect x="335" y="150" width="95" height="120" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="382" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">ufw</text>
  <text x="382" y="214" text-anchor="middle" font-size="13" fill="#991b1b">allow</text>
  <text x="382" y="234" text-anchor="middle" font-size="13" fill="#991b1b">:80  :443</text>
  <line x1="432" y1="210" x2="463" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Nginx -->
  <rect x="468" y="130" width="160" height="160" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="548" y="170" text-anchor="middle" font-size="20" font-weight="700" fill="#166534">Nginx</text>
  <text x="548" y="195" text-anchor="middle" font-size="13" fill="#14532d">TLS (certbot)</text>
  <text x="548" y="215" text-anchor="middle" font-size="13" fill="#14532d">server blocks</text>
  <text x="548" y="235" text-anchor="middle" font-size="13" fill="#14532d">sites-enabled/</text>
  <text x="548" y="265" text-anchor="middle" font-size="12" fill="#15803d">logs: /var/log/nginx</text>

  <!-- Static files -->
  <path d="M630,175 L660,175 L660,150 L686,150" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="690" y="110" width="180" height="80" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="780" y="143" text-anchor="middle" font-size="17" font-weight="700" fill="#854d0e">Static files</text>
  <text x="780" y="166" text-anchor="middle" font-size="13" fill="#713f12">/var/www/example.com</text>
  <text x="668" y="140" text-anchor="end" font-size="12" fill="#475569">root</text>

  <!-- Node app -->
  <path d="M630,245 L660,245 L660,270 L686,270" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="690" y="230" width="180" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="780" y="263" text-anchor="middle" font-size="17" font-weight="700" fill="#5b21b6">Node.js app</text>
  <text x="780" y="286" text-anchor="middle" font-size="13" fill="#4c1d95">127.0.0.1:3000</text>
  <text x="668" y="295" text-anchor="end" font-size="12" fill="#475569">proxy_pass</text>

  <!-- Legend -->
  <text x="602" y="355" text-anchor="middle" font-size="13" fill="#0f172a">Only 80/443 are public; the app listens on localhost only.</text>
  <text x="602" y="380" text-anchor="middle" font-size="13" fill="#475569">Adds headers: Host · X-Real-IP · X-Forwarded-For · X-Forwarded-Proto</text>
</svg>
