<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Deployed Node.js App on an Ubuntu Server</text>

  <!-- Internet -->
  <rect x="330" y="70" width="240" height="60" rx="30" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="450" y="97" text-anchor="middle" font-size="18" font-weight="700" fill="#075985">Internet users</text>
  <text x="450" y="117" text-anchor="middle" font-size="12" fill="#0369a1">https://app.example.com</text>
  <line x1="450" y1="133" x2="450" y2="202" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Server box -->
  <rect x="30" y="160" width="840" height="440" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="50" y="185" font-size="14" font-weight="700" fill="#64748b">UBUNTU 24.04 VPS / EC2</text>

  <!-- ufw -->
  <rect x="200" y="205" width="500" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="450" y="228" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">ufw firewall</text>
  <text x="450" y="246" text-anchor="middle" font-size="12" fill="#b91c1c">allow 22 (OpenSSH) · 80, 443 (Nginx Full) · deny the rest</text>
  <line x1="450" y1="258" x2="450" y2="282" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- nginx -->
  <rect x="200" y="285" width="500" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="311" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">Nginx reverse proxy (TLS via certbot)</text>
  <text x="450" y="331" text-anchor="middle" font-size="12" fill="#14532d">:443 HTTPS · :80 redirects · proxy_pass http://127.0.0.1:3000</text>
  <line x1="450" y1="348" x2="450" y2="372" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- app -->
  <rect x="200" y="375" width="500" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="450" y="401" text-anchor="middle" font-size="17" font-weight="700" fill="#5b21b6">Node.js app on 127.0.0.1:3000</text>
  <text x="450" y="421" text-anchor="middle" font-size="12" fill="#6d28d9">systemd unit myapp.service (user: deploy) or Docker Compose</text>
  <line x1="450" y1="438" x2="450" y2="462" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- postgres -->
  <rect x="200" y="465" width="500" height="55" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="450" y="490" text-anchor="middle" font-size="17" font-weight="700" fill="#854d0e">PostgreSQL on 127.0.0.1:5432</text>
  <text x="450" y="508" text-anchor="middle" font-size="12" fill="#713f12">not exposed to the internet</text>

  <!-- cron backup -->
  <rect x="720" y="375" width="135" height="60" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="787" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">cron 02:30</text>
  <text x="787" y="420" text-anchor="middle" font-size="12" fill="#14532d">pg_dump + tar</text>
  <line x1="703" y1="492" x2="760" y2="492" stroke="#475569" stroke-width="2"/>
  <line x1="760" y1="492" x2="760" y2="441" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="438" x2="820" y2="529" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="720" y="532" width="135" height="50" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="787" y="555" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">/backups</text>
  <text x="787" y="572" text-anchor="middle" font-size="11" fill="#14532d">keep 7 days</text>

  <!-- logs -->
  <rect x="45" y="375" width="135" height="60" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="112" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">journald</text>
  <text x="112" y="420" text-anchor="middle" font-size="12" fill="#334155">journalctl -u myapp</text>
  <line x1="197" y1="405" x2="183" y2="405" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="45" y="285" width="135" height="60" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="112" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">/var/log/nginx</text>
  <text x="112" y="330" text-anchor="middle" font-size="12" fill="#334155">logrotate daily</text>
  <line x1="197" y1="315" x2="183" y2="315" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- footer -->
  <text x="420" y="552" text-anchor="middle" font-size="13" fill="#334155">unattended-upgrades · SSH keys only, no root login · fail2ban</text>
  <text x="420" y="576" text-anchor="middle" font-size="13" fill="#334155">monitoring: uptime, df -h, free -h, systemctl --failed, health check</text>
</svg>
