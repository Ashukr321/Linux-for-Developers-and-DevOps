<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Docker Engine Architecture on Linux</text>

  <!-- Client -->
  <rect x="40" y="80" width="200" height="110" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="140" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#075985">docker CLI</text>
  <g font-size="13" fill="#0369a1" text-anchor="middle">
    <text x="140" y="136">docker run / build / ps</text>
    <text x="140" y="156">docker compose up</text>
    <text x="140" y="176">(client)</text>
  </g>

  <!-- Daemon -->
  <rect x="300" y="80" width="300" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">dockerd (Docker daemon)</text>
  <g font-size="13" fill="#14532d" text-anchor="middle">
    <text x="450" y="136">REST API on /var/run/docker.sock</text>
    <text x="450" y="156">images · networks · volumes · builds</text>
    <text x="450" y="176">systemd service: docker.service</text>
  </g>

  <!-- Registry -->
  <rect x="660" y="80" width="200" height="110" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="760" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#854d0e">Registry</text>
  <g font-size="13" fill="#713f12" text-anchor="middle">
    <text x="760" y="136">Docker Hub, GHCR, ECR</text>
    <text x="760" y="156">nginx:alpine</text>
    <text x="760" y="176">postgres:16</text>
  </g>

  <line x1="243" y1="135" x2="297" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="125" text-anchor="middle" font-size="11" fill="#475569">API</text>
  <line x1="603" y1="135" x2="657" y2="135" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="630" y="125" text-anchor="middle" font-size="11" fill="#475569">pull/push</text>

  <!-- containerd -->
  <line x1="450" y1="193" x2="450" y2="222" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="225" width="300" height="70" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="450" y="254" text-anchor="middle" font-size="18" font-weight="700" fill="#5b21b6">containerd</text>
  <text x="450" y="278" text-anchor="middle" font-size="13" fill="#6d28d9">container lifecycle · image store · shim + runc</text>

  <!-- Containers -->
  <line x1="450" y1="298" x2="450" y2="327" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="330" width="820" height="120" rx="12" fill="#f8fafc" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="450" y="356" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Containers (isolated processes)</text>
  <g font-size="14" text-anchor="middle">
    <rect x="70" y="370" width="230" height="62" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="185" y="396" font-weight="600" fill="#14532d">web (nginx)</text>
    <text x="185" y="418" font-size="12" fill="#166534">-p 8080:80 · bind mount</text>
    <rect x="335" y="370" width="230" height="62" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="450" y="396" font-weight="600" fill="#14532d">app (node)</text>
    <text x="450" y="418" font-size="12" fill="#166534">built from Dockerfile</text>
    <rect x="600" y="370" width="230" height="62" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="715" y="396" font-weight="600" fill="#14532d">db (postgres)</text>
    <text x="715" y="418" font-size="12" fill="#166534">named volume: pgdata</text>
  </g>

  <!-- Kernel -->
  <line x1="450" y1="453" x2="450" y2="477" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="480" width="820" height="95" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="450" y="508" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Linux Kernel (shared by all containers)</text>
  <g font-size="13" fill="#334155" text-anchor="middle">
    <text x="250" y="535">namespaces: pid · net · mnt · uts · ipc · user</text>
    <text x="650" y="535">cgroups: CPU · memory · I/O limits</text>
    <text x="450" y="560">overlayfs (image layers) · iptables/nftables (port publishing)</text>
  </g>
</svg>
