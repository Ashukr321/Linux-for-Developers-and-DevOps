<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Safe Config Edit on a Server</text>
  <text x="450" y="70" text-anchor="middle" font-size="14" fill="#64748b">Never reload a service with a config you have not validated</text>

  <!-- 1. Backup -->
  <rect x="30" y="110" width="180" height="110" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="120" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#075985">1. Backup</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#0f172a" text-anchor="middle">
    <text x="120" y="168">sudo cp nginx.conf</text>
    <text x="120" y="186">nginx.conf.bak</text>
  </g>
  <text x="120" y="208" text-anchor="middle" font-size="12" fill="#0369a1">a known-good copy</text>

  <line x1="212" y1="165" x2="243" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Edit -->
  <rect x="250" y="110" width="180" height="110" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="340" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#854d0e">2. Edit</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#0f172a" text-anchor="middle">
    <text x="340" y="168">sudoedit file</text>
    <text x="340" y="186">visudo / systemctl edit</text>
  </g>
  <text x="340" y="208" text-anchor="middle" font-size="12" fill="#a16207">vim or nano as your user</text>

  <line x1="432" y1="165" x2="463" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Validate -->
  <rect x="470" y="110" width="180" height="110" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="560" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#9d174d">3. Validate</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#0f172a" text-anchor="middle">
    <text x="560" y="166">sudo nginx -t</text>
    <text x="560" y="184">sudo visudo -c</text>
    <text x="560" y="202">sudo sshd -t</text>
  </g>

  <line x1="652" y1="165" x2="683" y2="165" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="668" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">OK</text>

  <!-- 4. Reload -->
  <rect x="690" y="110" width="180" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="780" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">4. Reload</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#0f172a" text-anchor="middle">
    <text x="780" y="168">sudo systemctl</text>
    <text x="780" y="186">reload nginx</text>
  </g>
  <text x="780" y="208" text-anchor="middle" font-size="12" fill="#166534">then check status / logs</text>

  <!-- Failure path -->
  <line x1="560" y1="222" x2="560" y2="293" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="572" y="262" font-size="12" font-weight="700" fill="#dc2626">FAIL</text>

  <rect x="430" y="300" width="260" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="560" y="328" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">Fix it, or restore the backup</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#0f172a" text-anchor="middle">
    <text x="560" y="354">sudo cp nginx.conf.bak nginx.conf</text>
  </g>
  <text x="560" y="376" text-anchor="middle" font-size="12" fill="#991b1b">running service is untouched</text>

  <path d="M430,345 L340,345 L340,229" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="350" y="338" font-size="12" fill="#dc2626">edit again</text>

  <text x="450" y="425" text-anchor="middle" font-size="13" fill="#64748b">Keep a second SSH session open while changing sshd or sudoers, so a mistake cannot lock you out.</text>
</svg>
