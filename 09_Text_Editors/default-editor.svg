<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">How Linux Picks Your Default Editor</text>

  <!-- Tools that open an editor -->
  <text x="450" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">TOOLS THAT OPEN AN EDITOR</text>
  <g font-size="14" fill="#0f172a" text-anchor="middle" font-family="Consolas, Menlo, monospace">
    <rect x="40"  y="92" width="125" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="102" y="117">crontab -e</text>
    <rect x="180" y="92" width="125" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="242" y="117">git commit</text>
    <rect x="320" y="92" width="125" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="382" y="117">visudo</text>
    <rect x="460" y="92" width="125" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="522" y="117">sudoedit</text>
    <rect x="600" y="92" width="125" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="662" y="117">systemctl edit</text>
    <rect x="740" y="92" width="125" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="802" y="117">kubectl edit</text>
  </g>
  <line x1="450" y1="136" x2="450" y2="166" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 1: VISUAL -->
  <rect x="250" y="170" width="400" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">1. Is $VISUAL set?</text>
  <text x="450" y="218" text-anchor="middle" font-size="13" fill="#14532d">Full-screen editor preference</text>

  <!-- Step 2: EDITOR -->
  <line x1="450" y1="230" x2="450" y2="266" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="462" y="253" font-size="13" fill="#64748b">no</text>
  <rect x="250" y="270" width="400" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="296" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">2. Is $EDITOR set?</text>
  <text x="450" y="318" text-anchor="middle" font-size="13" fill="#14532d">Usually set in ~/.bashrc</text>

  <!-- Step 3: /usr/bin/editor -->
  <line x1="450" y1="330" x2="450" y2="366" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="462" y="353" font-size="13" fill="#64748b">no</text>
  <rect x="250" y="370" width="400" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="396" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">3. /usr/bin/editor</text>
  <text x="450" y="418" text-anchor="middle" font-size="13" fill="#14532d">Debian/Ubuntu alternatives symlink</text>

  <!-- "yes" exits to "use it" -->
  <rect x="720" y="230" width="150" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="795" y="264" text-anchor="middle" font-size="17" font-weight="700" fill="#075985">Use that editor</text>
  <text x="795" y="287" text-anchor="middle" font-size="13" fill="#0369a1">e.g. vim, nano, code -w</text>
  <path d="M650,200 L795,200 L795,226" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M650,300 L716,300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="193" font-size="13" fill="#64748b">yes</text>
  <text x="665" y="293" font-size="13" fill="#64748b">yes</text>

  <!-- Results of alternatives -->
  <line x1="450" y1="430" x2="450" y2="466" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="458" text-anchor="start" dx="12" font-size="13" fill="#64748b">points to</text>
  <g text-anchor="middle">
    <rect x="130" y="470" width="190" height="64" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="225" y="497" font-size="18" font-weight="700" fill="#854d0e">nano</text>
    <text x="225" y="519" font-size="13" fill="#713f12">Ubuntu/Debian default</text>
    <rect x="355" y="470" width="190" height="64" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="450" y="497" font-size="18" font-weight="700" fill="#854d0e">vim.tiny / vim</text>
    <text x="450" y="519" font-size="13" fill="#713f12">if chosen or no nano</text>
    <rect x="580" y="470" width="190" height="64" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="675" y="497" font-size="18" font-weight="700" fill="#854d0e">vi</text>
    <text x="675" y="519" font-size="13" fill="#713f12">final fallback (RHEL, Alpine)</text>
  </g>
  <path d="M450,450 L225,450 L225,466" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M450,450 L675,450 L675,466" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Footer notes -->
  <g font-size="13" fill="#334155">
    <text x="40" y="575">Some tools check their own variable first: GIT_EDITOR / core.editor (git), SUDO_EDITOR (sudoedit),</text>
    <text x="40" y="597">SYSTEMD_EDITOR (systemctl edit), KUBE_EDITOR (kubectl edit), FCEDIT (fc).</text>
    <text x="40" y="619">Set it once: export EDITOR=vim  or  sudo update-alternatives --config editor</text>
  </g>
</svg>
