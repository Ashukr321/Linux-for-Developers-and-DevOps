<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">From Physical Disk to Mount Point</text>

  <!-- Column headings -->
  <g font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">
    <text x="115" y="88">1. PHYSICAL DISK</text>
    <text x="325" y="88">2. PARTITIONS</text>
    <text x="525" y="88">3. FILESYSTEM (mkfs)</text>
    <text x="760" y="88">4. MOUNT POINT IN /</text>
  </g>

  <!-- Disk 1 -->
  <rect x="40" y="110" width="150" height="250" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="115" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#075985">/dev/sda</text>
  <text x="115" y="240" text-anchor="middle" font-size="13" fill="#0369a1">500 GB SSD</text>
  <text x="115" y="260" text-anchor="middle" font-size="12" fill="#0369a1">(GPT table)</text>

  <!-- Disk 2 -->
  <rect x="40" y="400" width="150" height="90" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="115" y="440" text-anchor="middle" font-size="20" font-weight="700" fill="#075985">/dev/sdb</text>
  <text x="115" y="464" text-anchor="middle" font-size="13" fill="#0369a1">1 TB HDD</text>

  <!-- Partitions -->
  <g font-size="15" text-anchor="middle">
    <rect x="250" y="115" width="150" height="60" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="325" y="141" font-weight="700" fill="#854d0e">/dev/sda1</text><text x="325" y="161" font-size="12" fill="#713f12">1 GB</text>
    <rect x="250" y="205" width="150" height="60" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="325" y="231" font-weight="700" fill="#854d0e">/dev/sda2</text><text x="325" y="251" font-size="12" fill="#713f12">495 GB</text>
    <rect x="250" y="295" width="150" height="60" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="325" y="321" font-weight="700" fill="#854d0e">/dev/sda3</text><text x="325" y="341" font-size="12" fill="#713f12">4 GB</text>
    <rect x="250" y="415" width="150" height="60" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="325" y="441" font-weight="700" fill="#854d0e">/dev/sdb1</text><text x="325" y="461" font-size="12" fill="#713f12">1 TB</text>
  </g>

  <!-- Filesystems -->
  <g font-size="15" text-anchor="middle">
    <rect x="450" y="115" width="150" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="525" y="150" font-weight="700" fill="#166534">vfat (EFI)</text>
    <rect x="450" y="205" width="150" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="525" y="240" font-weight="700" fill="#166534">ext4</text>
    <rect x="450" y="295" width="150" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="525" y="330" font-weight="700" fill="#166534">swap (mkswap)</text>
    <rect x="450" y="415" width="150" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="525" y="450" font-weight="700" fill="#166534">xfs</text>
  </g>

  <!-- Arrows disk -> partition -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <line x1="192" y1="145" x2="246" y2="145"/>
    <line x1="192" y1="235" x2="246" y2="235"/>
    <line x1="192" y1="325" x2="246" y2="325"/>
    <line x1="192" y1="445" x2="246" y2="445"/>
    <line x1="402" y1="145" x2="446" y2="145"/>
    <line x1="402" y1="235" x2="446" y2="235"/>
    <line x1="402" y1="325" x2="446" y2="325"/>
    <line x1="402" y1="445" x2="446" y2="445"/>
  </g>

  <!-- Directory tree -->
  <rect x="650" y="105" width="220" height="385" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <g font-size="15" fill="#0f172a">
    <text x="672" y="240" font-weight="700" font-size="18" fill="#16a34a">/</text>
    <line x1="676" y1="248" x2="676" y2="460" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="676" y1="145" x2="676" y2="226" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="676" y1="145" x2="700" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="706" y="150" font-weight="700">/boot/efi</text>
    <line x1="676" y1="290" x2="700" y2="290" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="706" y="295">/home, /etc, /var</text>
    <line x1="676" y1="380" x2="700" y2="380" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="706" y="385" fill="#64748b">/tmp, /usr ...</text>
    <line x1="676" y1="445" x2="700" y2="445" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="706" y="450" font-weight="700">/data</text>
  </g>

  <!-- Arrows filesystem -> mount point -->
  <g stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)">
    <line x1="602" y1="145" x2="696" y2="145"/>
    <line x1="602" y1="235" x2="664" y2="235"/>
    <line x1="602" y1="445" x2="696" y2="445"/>
  </g>
  <g font-size="12" fill="#16a34a" font-weight="600">
    <text x="610" y="137">mount</text>
    <text x="606" y="227">mount</text>
    <text x="610" y="437">mount</text>
  </g>
  <text x="620" y="330" font-size="12" fill="#64748b">swapon (no mount point)</text>

  <!-- Footer -->
  <rect x="40" y="515" width="830" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="455" y="540" text-anchor="middle" font-size="14" fill="#0f172a">lsblk  →  fdisk / parted  →  mkfs.ext4 / mkswap  →  mount / swapon  →  /etc/fstab (persist at boot)</text>
  <text x="455" y="562" text-anchor="middle" font-size="12" fill="#64748b">A disk is a raw device; a filesystem becomes usable only after it is mounted on a directory of the single / tree.</text>
</svg>
